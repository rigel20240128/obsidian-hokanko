<title>業務委託に関するご提案｜株式会社RIGEL</title>
<style>
  @page { size: 1920px 1080px; margin: 0; }
  * { box-sizing: border-box; margin:0; padding:0; }
  :root{
    --bg:#F7F6F3; --ink:#17181A; --sub:#6B6E73;
    --main:#026881; --light:#74ACBA; --rule:#E3E1DB; --dark:#014B5D;
  }
  html,body{ background:var(--bg); overflow:hidden; }
  body{
    font-family:"Noto Sans JP","Noto Sans CJK JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .slide{
    position:relative; width:1920px; height:1080px;
    background:var(--bg); overflow:hidden;
    page-break-after:always;
  }

  /* 左上 kicker（章名ラベル 22px/500） */
  .kicker{
    position:absolute; left:120px; top:88px;
    font-size:22px; font-weight:500; letter-spacing:.18em;
    color:var(--main);
  }
  .kicker::after{
    content:""; display:block; width:64px; height:3px;
    background:var(--main); margin-top:14px;
  }

  /* 右上 ロゴ（全ページ固定・クリアスペース確保） */
  .logo{ position:absolute; right:120px; top:74px; height:104px; width:auto; }

  /* 右下 ページ番号 */
  .pageno{
    position:absolute; right:120px; bottom:72px;
    font-size:24px; font-weight:400; color:var(--sub);
    letter-spacing:.08em;
  }

  /* 表紙本文（左寄せ・上部、下部に余白） */
  .cover-body{ position:absolute; left:120px; top:330px; right:120px; }
  .cover-title{
    font-size:88px; font-weight:900; color:var(--ink);
    letter-spacing:.02em; line-height:1.22;
  }
  .cover-title .accent{ color:var(--main); }
  .cover-rule{
    width:180px; height:5px; background:var(--main); margin:44px 0 40px;
  }
  .cover-sub{
    font-size:40px; font-weight:500; color:var(--sub);
    line-height:1.6; letter-spacing:.02em;
  }
  .cover-meta{
    position:absolute; left:120px; bottom:120px;
    font-size:24px; font-weight:400; color:var(--sub);
    line-height:1.9; letter-spacing:.04em;
  }
  .cover-meta .co{
    display:block; font-size:32px; font-weight:700;
    color:var(--ink); letter-spacing:.06em; margin-bottom:6px;
  }
</style></head><body>
