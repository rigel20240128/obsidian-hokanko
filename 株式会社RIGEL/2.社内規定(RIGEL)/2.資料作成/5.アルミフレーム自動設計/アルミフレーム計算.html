<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルミフレーム計算（長さ・型式・本数）</title>

<!-- ==================== CSS ==================== -->
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1f2933; --sub:#52606d; --line:#d3dce6;
    --accent:#1769aa; --accent2:#0f4c75; --hi:#eaf3fb; --ok:#2e7d32;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  }
  header{ background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; padding:16px 20px; }
  header h1{ margin:0; font-size:18px; }
  header p{ margin:4px 0 0; font-size:12.5px; opacity:.9; }
  .wrap{ max-width:820px; margin:0 auto; padding:18px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  h2{ font-size:15px; color:var(--accent2); margin:0 0 14px; border-left:4px solid var(--accent); padding-left:8px; }

  /* 入力欄 */
  .inputs{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media(max-width:640px){ .inputs{ grid-template-columns:1fr 1fr; } }
  .fld label{ display:block; font-size:12.5px; color:var(--sub); font-weight:600; margin-bottom:4px; }
  .fld input, .fld select{
    width:100%; padding:11px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:20px; text-align:center; background:#fff;
  }
  .fld input:focus, .fld select:focus{ outline:2px solid var(--hi); border-color:var(--accent); }

  /* 詳細設定 */
  .adv{ margin-top:12px; font-size:12.5px; color:var(--sub); }
  .adv summary{ cursor:pointer; font-weight:600; color:var(--accent2); }
  .adv .row{ display:flex; gap:16px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .adv input{ width:90px; padding:6px 8px; font-size:14px; text-align:center; border:1px solid var(--line); border-radius:6px; }
  .adv select{ width:120px; padding:6px; font-size:14px; border:1px solid var(--line); border-radius:6px; }

  /* 結果テーブル */
  table{ width:100%; border-collapse:collapse; font-size:15px; }
  th, td{ border:1px solid var(--line); padding:11px 10px; text-align:center; }
  th{ background:var(--hi); color:var(--accent2); font-size:13px; }
  td.name{ text-align:left; font-weight:600; }
  td.model{ font-family:"Consolas",monospace; font-size:14px; color:var(--accent2); font-weight:600; }
  td.len{ font-size:20px; font-weight:700; color:var(--accent2); }
  td.qty{ font-size:18px; font-weight:700; }
  tfoot td{ background:#f3f8fd; font-weight:700; }

  .cap{ margin-top:12px; font-size:14px; color:var(--sub); }
  .cap b{ color:var(--ink); font-family:monospace; }
  .err{ color:#c0392b; font-weight:600; font-size:13px; min-height:18px; margin-top:8px; }

  .btns{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
  button{ cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600; padding:10px 16px; }
  .csv{ background:var(--ok); color:#fff; } .csv:hover{ filter:brightness(.93); }
  .hint{ font-size:12px; color:var(--sub); margin-top:8px; }
  code{ background:#eef2f6; padding:1px 5px; border-radius:4px; }
</style>
</head>

<body>
<header>
  <h1>アルミフレーム計算</h1>
  <p>12本サイコロ形（直方体）／ 長さ・型式（品番）・本数を自動計算 ・ 株式会社RIGEL</p>
</header>

<div class="wrap">

  <!-- 入力 -->
  <div class="card">
    <h2>寸法を入力</h2>
    <div class="inputs">
      <div class="fld">
        <label>太さ □</label>
        <select id="t">
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="60">60</option>
          <option value="80">80</option>
        </select>
      </div>
      <div class="fld"><label>高さ（縦）mm</label><input type="number" id="H" value="1000" min="1"></div>
      <div class="fld"><label>幅（横）mm</label><input type="number" id="W" value="600" min="1"></div>
      <div class="fld"><label>奥行 mm</label><input type="number" id="D" value="800" min="1"></div>
    </div>

    <details class="adv">
      <summary>詳細設定（キャップ）</summary>
      <div class="row">
        <span>キャップ高さ <input type="number" id="capH" value="3" min="0" step="0.5"> mm/個</span>
        <span>柱1本あたり
          <select id="capN">
            <option value="1" selected>1個(上端)</option>
            <option value="2">2個(上下)</option>
            <option value="0">0個</option>
          </select>
        </span>
      </div>
      <div class="hint">柱長 ＝ 高さ − キャップ高さ × 個数（例：1000 − 3 = 997）</div>
    </details>

    <div class="err" id="err"></div>
  </div>

  <!-- 結果 -->
  <div class="card">
    <h2>計算結果</h2>
    <table id="out"></table>
    <div class="cap" id="capLine"></div>
    <div class="btns"><button class="csv" onclick="downloadCSV()">⬇ CSV出力</button></div>
    <div class="hint">
      型式 <code>NFSL6-太さ太さ-長さ</code>（切断長0.5mm単位）／ キャップ <code>HFCB6-太さ太さ-B</code>
    </div>
  </div>

</div>

<!-- ==================== JavaScript ==================== -->
<script>
"use strict";

/* --- 部材データ --- */
const CAP = { 30:"HFCB6-3030-B", 40:"（□40用は未指定）", 60:"HFCB6-6060-B", 80:"（□80用は未指定）" };

/* --- ユーティリティ --- */
const g       = id => document.getElementById(id);
const num     = id => parseFloat(g(id).value);
const round05 = v  => Math.round(v * 2) / 2;                       // 0.5mm単位に丸め
const fmtLen  = v  => { const r = round05(v); return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const model   = (t, len) => `NFSL6-${t}${t}-${fmtLen(len)}`;        // 型式（発注品番）

let cache = null;  // CSV用に直近の結果を保持

/* --- メイン計算 --- */
function calc(){
  const t    = parseInt(g('t').value, 10);
  const H    = num('H'), W = num('W'), D = num('D');
  const capH = num('capH'), capN = parseInt(g('capN').value, 10);
  const err  = g('err');

  // 入力チェック
  if([H,W,D].some(v => !(v > 0))){
    err.textContent = "高さ・幅・奥行に正の数値を入力してください。";
    g('out').innerHTML = ""; g('capLine').textContent = ""; return;
  }
  if(t*2 >= W || t*2 >= D){
    err.textContent = `幅・奥行は太さ×2（${t*2}mm）より大きくしてください。`;
    g('out').innerHTML = ""; g('capLine').textContent = ""; return;
  }
  err.textContent = "";

  // 長さ計算（3種類 × 各4本 ＝ 12本）
  const Z    = round05(H - capH * capN);   // 柱（縦）
  const Wlen = round05(W - t * 2);          // 幅フレーム
  const Dlen = round05(D - t * 2);          // 奥行フレーム

  const rows = [
    { name:"柱（縦）",         len:Z,    qty:4 },
    { name:"幅フレーム（横）", len:Wlen, qty:4 },
    { name:"奥行フレーム（横）", len:Dlen, qty:4 },
  ];

  // 結果テーブル描画
  let html = `<thead><tr><th>部材</th><th>型式（品番）</th><th>長さ(mm)</th><th>本数</th></tr></thead><tbody>`;
  rows.forEach(r => {
    r.model = model(t, r.len);
    html += `<tr><td class="name">${r.name}</td><td class="model">${r.model}</td>`
          + `<td class="len">${fmtLen(r.len)}</td><td class="qty">${r.qty}</td></tr>`;
  });
  html += `</tbody><tfoot><tr><td colspan="3">合計</td><td class="qty">12 本</td></tr></tfoot>`;
  g('out').innerHTML = html;

  // キャップ
  const capQty = capN > 0 ? 4 * capN : 0;
  g('capLine').innerHTML = `キャップ：<b>${CAP[t]}</b> × ${capQty} 個`;

  cache = { t, H, W, D, rows, cap:CAP[t], capQty };
}

/* --- CSV出力 --- */
function downloadCSV(){
  if(!cache){ alert("先に寸法を入力してください。"); return; }
  const c = cache, L = [];
  L.push(["アルミフレーム計算（12本サイコロ形）"]);
  L.push(["太さ", `□${c.t}`, "外形(高さ×幅×奥行)", `${c.H}×${c.W}×${c.D}`]);
  L.push([]);
  L.push(["部材", "型式（品番）", "長さ(mm)", "本数"]);
  c.rows.forEach(r => L.push([r.name, r.model, fmtLen(r.len), r.qty]));
  L.push(["キャップ", c.cap, "", c.capQty]);

  const csv = "﻿" + L.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "アルミフレーム計算.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

/* --- 入力のたびにリアルタイム計算 --- */
["t","H","W","D","capH","capN"].forEach(id => {
  g(id).addEventListener('input', calc);
  g(id).addEventListener('change', calc);
});
calc();  // 初期表示
</script>
</body>
</html>
