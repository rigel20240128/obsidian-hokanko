<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>RTS A4チラシ 表面プレビュー</title>
<style>
body{background:#ddd;margin:0;padding:24px;font-family:"Noto Sans JP",sans-serif;}
.card{width:400px;aspect-ratio:210/297;background:#fff;border:1px solid #ccc;padding:18px 16px;box-sizing:border-box;display:flex;flex-direction:column;color:#333;font-size:12px;margin:auto;}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.logo{width:70px;height:30px;background:#F4F5F7;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#888;}
.rts{text-align:right;}
.rts b{font-size:14px;color:#026881;}
.rts span{font-size:8px;color:#5F5E5A;display:block;}
.catch{font-size:19px;font-weight:700;color:#026881;line-height:1.4;margin-bottom:3px;}
.sub{font-size:11px;margin-bottom:12px;}
.flow{background:#F4F5F7;border-radius:6px;padding:8px;margin-bottom:12px;font-size:8px;color:#5F5E5A;text-align:center;}
.body{display:flex;gap:12px;flex:1;}
.feat{display:flex;flex-direction:column;gap:8px;flex:1;}
.feat div b{display:block;font-size:9px;}
.feat div span{font-size:8px;color:#5F5E5A;}
.photo{width:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.photo img{width:100%;object-fit:contain;border-radius:4px;}
.photo p{font-size:7px;color:#5F5E5A;margin:3px 0 0;text-align:center;}
.foot{margin-top:auto;border-top:1px solid #ddd;padding-top:8px;font-size:8px;color:#5F5E5A;display:flex;justify-content:space-between;}
</style></head>
<body>
<div class="card">
  <div class="hdr">
    <div class="logo">RIGELロゴ</div>
    <div class="rts"><b>RTS</b><span>「Robot training system」</span></div>
  </div>
  <div class="catch">設備を買う前に、<br>人を育てる。</div>
  <div class="sub">産業用ロボット教育レンタルシステム</div>
  <div class="flow">はじめ方はシンプル：キットが届く → 組み立てる → 動かして学ぶ → 技術者に育つ</div>
  <div class="body">
    <div class="feat">
      <div><b>産業グレードの実機で学べる</b><span>習得スキルがそのまま実務に直結</span></div>
      <div><b>月額制、買わずに始められる</b><span>最短3ヶ月から</span></div>
      <div><b>JANOME製ロボットを採用</b><span>産業用ロボットのリーディングブランド</span></div>
    </div>
    <div class="photo">
      <img src="../5.画像、イラスト/JR3203.png" alt="JANOME JR3203">
      <p>JANOME製ロボット搭載</p>
    </div>
  </div>
  <div class="foot"><span>STANDARDプラン　月額¥120,000〜（初期費用¥100,000）</span><span>株式会社RIGEL ©2026</span></div>
</div>
</body></html>
